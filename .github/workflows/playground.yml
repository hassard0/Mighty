name: Playground CI

# v0.35 T1 — Build + smoke-test the browser playground on every change.
#
# The real publish path is `pages.yml`, which builds the same artifacts
# and merges them with the docs site under
# `https://hassard0.github.io/Mighty/playground/`. This workflow exists
# so PRs that touch `tools/playground/**` or the Rust front-end (parser
# / HIR / typeck / borrowck / IR / driver / CLI) catch playground
# regressions before merge.

on:
  push:
    branches: [main]
    paths:
      - "tools/playground/**"
      - "tools/gallery/**"
      - "crates/mty-cli/src/playground.rs"
      - "crates/mty-cli/Cargo.toml"
      - "crates/mty-driver/**"
      - "crates/mty-syntax/**"
      - "crates/mty-ast/**"
      - "crates/mty-hir/**"
      - "crates/mty-types/**"
      - "crates/mty-borrow/**"
      - "crates/mty-ir/**"
      - "crates/mty-diagnostics/**"
      - ".github/workflows/playground.yml"
  pull_request:
    paths:
      - "tools/playground/**"
      - "tools/gallery/**"
      - "crates/mty-cli/src/playground.rs"
      - "crates/mty-cli/Cargo.toml"
      - "crates/mty-driver/**"
      - "crates/mty-syntax/**"
      - "crates/mty-ast/**"
      - "crates/mty-hir/**"
      - "crates/mty-types/**"
      - "crates/mty-borrow/**"
      - "crates/mty-ir/**"
      - "crates/mty-diagnostics/**"
      - ".github/workflows/playground.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playground-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    name: build + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-playground-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-playground-

      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          fi
          wasm-pack --version

      - name: wasm-pack build (mty-cli playground)
        run: |
          cd crates/mty-cli
          wasm-pack build --target web \
            -d ../../tools/playground/public/wasm \
            -- --no-default-features --features playground-wasm

      - name: Verify wasm artifact
        run: |
          ls -la tools/playground/public/wasm/
          test -s tools/playground/public/wasm/mty_cli_bg.wasm
          test -s tools/playground/public/wasm/mty_cli.js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tools/playground/package-lock.json

      - name: npm install (playground)
        run: cd tools/playground && npm ci

      - name: typecheck
        run: cd tools/playground && npm run typecheck

      - name: build
        run: cd tools/playground && npm run build

      - name: Install Playwright browsers
        run: cd tools/playground && npx playwright install --with-deps chromium

      - name: Playwright smoke (wasm backend)
        run: cd tools/playground && npm test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tools/playground/playwright-report/
          retention-days: 7
