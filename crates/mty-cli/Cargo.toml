[package]
name = "mty-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# v0.33 T3 added a second `[[bin]]` (`mty-playground`) behind the
# `playground-wasm` feature. Without `default-run`, plain
# `cargo run -p mty-cli` errors with "could not determine which
# binary to run" (caught by the v0.33 release CI's example sweep).
default-run = "mty"

[lib]
name = "mty_cli"
path = "src/lib.rs"
# v0.35 T1 — `cdylib` is required by `wasm-pack build` for the
# playground entry point's wasm-bindgen exports. `rlib` keeps the
# native integration tests under `tests/` working (they reach into
# `mty_cli::cmd::*`).
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "mty"
path = "src/main.rs"
required-features = ["host-toolchain"]

# v0.33 T3 / v0.35 T1 — browser playground.
#
# The browser playground's wasm-bindgen exports (`init / check / run`)
# now live in the `playground` module of the lib cdylib (see
# `src/playground.rs`). `wasm-pack build --target web` picks them up
# automatically from the cdylib — no separate `[[bin]]` needed (the
# v0.33 T3 attempt to use a binary was the reason wasm-pack errored
# with "crate-type must be cdylib").
#
# Build:
#   wasm-pack build --target web \
#     --no-default-features --features playground-wasm \
#     --out-dir ../../tools/playground/public/wasm \
#     crates/mty-cli

[features]
# Default-on. The full native CLI surface (`mty new`, `mty build`,
# `mty run`, `mty test`, `mty serve`, `mty lsp`, `mty dap`, `mty pkg`,
# `mty inspect`, `mty replay`, `mty reload`, `mty agent`, `mty doc`,
# `mty hooks`) — all reach into the tokio/hyper/codegen/runtime stack.
# Disable with `--no-default-features` when building the wasm playground.
default = ["host-toolchain"]
host-toolchain = [
    "dep:mty-codegen-cranelift",
    "dep:mty-codegen-wasm",
    "dep:mty-lsp",
    "dep:mty-doc",
    "dep:mty-pkg",
    "dep:mty-runtime",
    "dep:mty-stdlib",
    "dep:tokio",
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
    "dep:notify",
    "dep:clap",
    "dep:ariadne",
    "dep:thiserror",
    "mty-driver/host-toolchain",
]
# Wasm playground entry point. Enabled only on wasm32 builds via
# `wasm-pack build --no-default-features --features playground-wasm`.
playground-wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen"]

[dependencies]
# v0.33 T3 — wasm-bindgen ships the JS glue for the playground
# binary. Optional + behind the `playground-wasm` feature so the
# native CLI build doesn't pull it in.
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
# v0.35 T1 — clap/ariadne are only reachable from the native binary;
# move them behind `host-toolchain` so the wasm bin's dep graph stays
# trim.
clap = { workspace = true, optional = true }
ariadne = { workspace = true, optional = true }
mty-driver = { path = "../mty-driver", default-features = false }
mty-syntax = { path = "../mty-syntax" }
mty-ast = { path = "../mty-ast" }
mty-hir = { path = "../mty-hir" }
mty-diagnostics = { path = "../mty-diagnostics" }
mty-fmt = { path = "../mty-fmt" }
mty-ir = { path = "../mty-ir" }
mty-types = { path = "../mty-types" }
mty-borrow = { path = "../mty-borrow" }
# v0.35 T1 — gated behind `host-toolchain` so the wasm playground build
# doesn't reach into cranelift/LLVM/wasm-codegen/runtime/stdlib.
mty-codegen-cranelift = { path = "../mty-codegen-cranelift", optional = true }
mty-codegen-wasm = { path = "../mty-codegen-wasm", optional = true }
mty-lsp = { path = "../mty-lsp", optional = true }
mty-doc = { path = "../mty-doc", optional = true }
mty-pkg = { path = "../mty-pkg", optional = true }
# v0.3 Task 1: install the stdlib host dispatcher at CLI startup so
# `mty run` programs that call `std.*` get the real implementations
# (json/fs/time/http) instead of `Value::Unit`.
#
# v0.30 Track E flips the `runner` feature back on so the new
# `mty test` subcommand can call `mty_stdlib::test::run_dir` — the
# v0.2-era cycle that originally motivated `default-features = false`
# no longer exists (mty-driver doesn't pull stdlib, so the path
# is clean). See STDLIB_V0_2_NOTES.md for the original constraint.
#
# v0.30 Track D — `observe-sqlite` powers `mty inspect --cost`. Pulls
# the rusqlite dep into the CLI binary, but the alternative (a copy of
# the storage layer here) is worse.
mty-stdlib = { path = "../mty-stdlib", default-features = false, features = ["runner", "observe-sqlite"], optional = true }
mty-runtime = { path = "../mty-runtime", optional = true }
# v0.16 `mty inspect` subcommand: JSON over the runtime control socket.
serde.workspace = true
serde_json.workspace = true
# v0.23 Track C — `mty serve` (built-in dev server) + `--watch` rebuild.
# hyper/http stack is already pulled in by mty-stdlib; we add a direct
# dep so cmd::serve can spin up its own listener. tokio gives us the
# runtime + select! loop for accept + shutdown + watcher events. notify
# powers the file-watch path that drives `--watch` rebuilds. See
# `dev/history/notes/MTY_SERVE_V0_23_NOTES.md`.
tokio = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
notify = { version = "6", optional = true }
# v0.30 Track E — `mty test --eval`: thiserror for the frontmatter
# parse error enum.
thiserror = { workspace = true, optional = true }

[dev-dependencies]
# v0.23 Track C — `cmd_serve.rs` smoke tests hit the dev server with a
# minimal blocking HTTP client. We deliberately don't pull in reqwest
# here (which would add rustls + ring transitively); the tests use the
# same tokio runtime they spawn the server under.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
# v0.30 Track E — `cmd::test` discovery + frontmatter parser tests
# spin up temp directories full of `*.eval.mty` fixtures.
tempfile = "3"

[lints]
workspace = true
