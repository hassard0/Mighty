[package]
name = "mty-swe-bench"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "SWE-bench Verified harness for the Mighty agent (v0.30 Track B adoption proof)."
publish = false

# This crate is intentionally OUTSIDE the main Mighty workspace.
# Its `reqwest`/`tar`/`zstd` deps are heavy and would slow down the
# `mty-cli` build for everyone if pulled in. Top-level Cargo.toml
# adds `bench/swe` to its `[workspace] exclude` list.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hex = "0.4"
once_cell = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
