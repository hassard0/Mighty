name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ----------------------------------------------------------------
  # Default cross-platform build/test matrix. This is the main gate
  # that blocks merges — all three OSes must be green.
  # ----------------------------------------------------------------
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      - name: Cargo registry cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cargo target cache
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo build
        run: cargo build --workspace

      - name: cargo test
        run: cargo test --workspace

      - name: stdlib hover-catalog drift gate (Linux only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          # v0.35 T5 Strategy B gate: extracted catalog
          # (`crates/mty-stdlib/docs/*.docstub`) must match the curated
          # gold-set (`crates/mty-doc/src/examples.rs::STDLIB_EXAMPLES`)
          # byte-for-byte. Non-zero exit on any drift.
          # See `docs/internals/stdlib-docs-pipeline.md`.
          cargo run -q -p mty-cli -- doc --check

      - name: example sweep (Linux only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          # Skip files marked `// @typeck-pending`: they demonstrate
          # parser-level surface syntax (e.g. RFC-008 effect rows in
          # examples/22_effect_row.mty) whose typeck wiring lands in a
          # later version. `fmt --check` still runs on every file.
          # v0.30 (Track A): also honor `// @compile-error` for
          # examples that demonstrate intentional MTxxxx diagnostics
          # (e.g. examples/33_taint_basics.mty's MT4099). `mty check`
          # is expected to FAIL on those — fmt still runs.
          for f in examples/*.mty; do
            if grep -q '@typeck-pending' "$f"; then
              echo "skip (typeck-pending): $f"
            elif grep -q '@compile-error' "$f"; then
              echo "expect-fail (compile-error): $f"
              if cargo run -q -p mty-cli -- check "$f" 2>/dev/null; then
                echo "ERROR: $f passed mty check but is marked @compile-error" >&2
                exit 1
              fi
            else
              cargo run -q -p mty-cli -- check "$f"
            fi
            cargo run -q -p mty-cli -- fmt --check "$f"
          done

      - name: demo smoke sweep (Linux only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          cargo build -q -p mty-cli
          for d in demos/*/; do
            if [[ -x "$d/smoke.sh" ]]; then
              echo "=== $d ==="
              bash "$d/smoke.sh"
            fi
          done

      # v0.37 T4: lock in the `locate_llvm_profdata_in` fallback chain
      # in `scripts/build-pgo.sh` that re-enables darwin-arm64 PGO.
      # The test mocks a rustup sysroot under a temp dir and asserts
      # the helper picks the right stub for each macos-14 layout we
      # saw in v0.36.1; it doesn't need rustc / cargo / a real PGO
      # build, so it's a cheap regression gate on every push.
      - name: build-pgo path-discovery unit tests (Linux only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bash scripts/tests/test-build-pgo-paths.sh

      # v0.38 T1: assert the cargo-pgo CI pipeline's tooling is healthy
      # BEFORE a release tag drives the 20-min fat-LTO build. Installs
      # cargo-pgo, asserts `cargo pgo --help` works, asserts the rustup
      # llvm-tools-preview matches rustc's LLVM major version (the
      # exact v0.37 darwin-arm64 mismatch shape). Linux-only because
      # the macOS / Windows release legs build cargo-pgo themselves
      # and an `llvm-tools-preview` skew on Linux is the most common
      # CI shape we want to gate on.
      - name: cargo-pgo availability + LLVM-match gate (Linux only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          rustup component add llvm-tools-preview --toolchain 1.95.0
          cargo install cargo-pgo --version 0.2.9 --locked
          bash scripts/tests/test-cargo-pgo-availability.sh

  # ----------------------------------------------------------------
  # `--no-default-features` job catches feature-gated breakage that
  # the default test job hides. Runs on Linux only — features are
  # uniform across OSes.
  #
  # v0.19 (KNOWN_ISSUES #7 closure): the example sweep now runs under
  # `--no-default-features` too. The default-features sweep above
  # already runs on every push, but a feature-gated regression in
  # the example corpus (e.g. an `#[cfg(feature = "...")]` reach into
  # an opt-in stdlib path) would slip past it. Adding the sweep here
  # closes the last v0.9-era P2 paper-cut.
  # ----------------------------------------------------------------
  test-minimal:
    name: test (minimal features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: minimal

      - name: cargo test (no default features)
        run: cargo test --workspace --no-default-features

      - name: example sweep (default features — bin requires host-toolchain)
        shell: bash
        run: |
          set -euo pipefail
          # v0.35.4: `[[bin]] mty` now requires `host-toolchain` (T1's
          # default-on feature gates the entire cmd/ tree). Running
          # `cargo run --no-default-features -p mty-cli` errors with
          # `target `mty` in package `mty-cli` requires the features:
          # `host-toolchain``. Drop `--no-default-features` for this
          # sweep — the test/cargo-test step above already exercises
          # the minimal-features library build; this sweep's value is
          # asserting the example corpus checks cleanly, not the
          # binary's feature minimality.
          # The `@typeck-pending` skip-list rules are the same — fmt is
          # checked in the default job so we only re-check syntax /
          # typeck here.
          # v0.30 (Track A): `@compile-error` examples are expected to
          # fail `mty check` — we assert the failure rather than blocking.
          for f in examples/*.mty; do
            if grep -q '@typeck-pending' "$f"; then
              echo "skip (typeck-pending): $f"
            elif grep -q '@compile-error' "$f"; then
              echo "expect-fail (compile-error): $f"
              if cargo run -q -p mty-cli -- check "$f" 2>/dev/null; then
                echo "ERROR: $f passed mty check but is marked @compile-error" >&2
                exit 1
              fi
            else
              cargo run -q -p mty-cli -- check "$f"
            fi
          done

  # ----------------------------------------------------------------
  # Stricter clippy pass — pedantic lints are enabled at the
  # workspace level via `[workspace.lints.clippy]` in the root
  # `Cargo.toml`, with style-preference lints allow-listed there.
  # Tightening the bar is a one-line edit to that table; see
  # `dev/history/notes/CLIPPY_V0_11_NOTES.md` for the rationale.
  #
  # v0.11: this job is required (no `continue-on-error`).
  # v0.19 (KNOWN_ISSUES #4 closure): verified — the job has no
  # `continue-on-error: true` and a clippy failure blocks merge.
  # ----------------------------------------------------------------
  clippy-strict:
    name: clippy (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: strict

      - name: cargo clippy --pedantic
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ----------------------------------------------------------------
  # v0.32 (Track D): multi-arch dry-run release build.
  #
  # `release.yml` cross-compiles the `mty` binary for 5 platforms
  # on every `v*` tag. A real release tag isn't the right moment to
  # discover that a cargo dep regressed on `aarch64-unknown-linux-gnu`
  # cross-compilation, so we replay the same build matrix on every
  # push to main (build only, no packaging, no upload).
  #
  # Job is intentionally non-blocking on PRs (push-only) to keep PR
  # latency under the cross-compile install budget. A failure here
  # is a release-blocker for the next tag but not a PR-merge blocker.
  # The `Swatinem/rust-cache` action keeps the cross-compile
  # toolchain primed across runs so the steady-state cost is one
  # `cross build` per platform per main push.
  # ----------------------------------------------------------------
  multi-arch-dry-run:
    name: multi-arch dry-run (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_cross: true
          # v0.32.1: x86_64-apple-darwin cross-compiles on
          # macos-14 (Apple Silicon). The Intel `macos-13` runner
          # pool is indefinitely-queued for free public repos as
          # of late May 2026 — cross-compile via target triple
          # avoids the queue entirely. See release.yml for the
          # matching rationale.
          - os: macos-14
            target: x86_64-apple-darwin
            use_cross: false
          - os: macos-14
            target: aarch64-apple-darwin
            use_cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}

      - name: Cargo cache (shared with release.yml key shape)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-dryrun-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-dryrun-
            ${{ runner.os }}-${{ matrix.target }}-cargo-release-

      - name: Install cross (aarch64 Linux only)
        if: matrix.use_cross == true
        # Pin matches release.yml — bumping here without bumping
        # release.yml would diverge the dry-run from the real build.
        run: cargo install cross --version 0.2.5 --locked

      - name: cargo build --release (native)
        if: matrix.use_cross == false
        env:
          # Multi-arch dry-run is a build-only smoke; we don't want
          # `RUSTFLAGS=-D warnings` from the workflow env turning a
          # benign new-lint into a release-blocker. The `test` job
          # above is the source of truth for warning policy.
          RUSTFLAGS: ""
        run: cargo build --release --bin mty -p mty-cli --target ${{ matrix.target }}

      - name: cross build --release (aarch64 Linux)
        if: matrix.use_cross == true
        env:
          RUSTFLAGS: ""
        run: cross build --release --bin mty -p mty-cli --target ${{ matrix.target }}

  # ----------------------------------------------------------------
  # MSRV gate — the documented minimum supported Rust version is
  # 1.85.0 (edition 2024 / indexmap 2.14). Bumping this is a
  # breaking change and requires a release note in RELEASE-v*.md.
  #
  # v0.10 polish: we now also compile-check the test surface and
  # actually run the bedrock crates' tests on MSRV. Full `cargo test
  # --workspace` is left to the stable matrix above because (a) it
  # exceeds the MSRV job's time budget and (b) running it here would
  # repeat work the stable jobs already cover. The bedrock subset
  # (syntax / types / fmt / diagnostics) catches the most common
  # MSRV regression — a dep silently bumping its rust-version floor
  # — without paying for the codegen / runtime crates twice.
  #
  # v0.18 (KNOWN_ISSUES #3 closure): the standalone `cargo build
  # --workspace` step is dropped — `cargo build --workspace --tests`
  # subsumes it, compiling the lib/bin AND test targets in one pass
  # so a dev-dep MSRV bump can never sneak through. The bedrock
  # `cargo test` step continues to actually RUN tests on MSRV so
  # behaviour regressions tied to the toolchain still get caught.
  # ----------------------------------------------------------------
  msrv:
    name: msrv (1.85.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.85.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv

      - name: cargo build --tests (MSRV, workspace)
        # KNOWN_ISSUES #3: compile lib/bin AND every test target so
        # a dev-dep that silently bumps its rust-version floor fails
        # the gate here rather than slipping into a later release.
        # Equivalent to `cargo test --workspace --no-run` but a
        # single command and a strictly larger build surface than
        # the previous `cargo build --workspace`.
        env:
          RUSTFLAGS: ""
        run: cargo build --workspace --tests

      - name: cargo test (MSRV, bedrock crates)
        # Actually execute the bedrock crates' tests on MSRV. These
        # four crates have no GPU / network / fs dependencies, run
        # in well under a minute, and exercise the language's most
        # MSRV-sensitive surface (syntax / types / diagnostics).
        env:
          RUSTFLAGS: ""
        run: |
          cargo test \
            -p mty-syntax \
            -p mty-types \
            -p mty-fmt \
            -p mty-diagnostics
