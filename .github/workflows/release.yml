name: Release

# Build the `mty` binary for Linux, macOS, and Windows whenever a
# `v*` tag lands on `main`, then attach the artifacts to the
# corresponding GitHub Release.
#
# The release itself is created or updated by this workflow if it
# does not yet exist. The body defaults to the tag message; a
# follow-up commit can flesh it out with the RELEASE-v0.X.md
# contents from `dev/history/releases/`.
#
# Triggering on tags-only (not branches) means routine pushes to
# main don't trip a binary build — only an integrator-tagged
# release does.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.15.0). Must already exist."
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      # v0.17 polish: `fail-fast: false` so a stuck/queued platform
      # cannot block the release publish step indefinitely. We still
      # want a partial release over no release at all. The publish
      # job below uses `fail_on_unmatched_files: false` so missing
      # platforms degrade gracefully.
      # v0.32 (Track D): matrix is now 5 platforms (added Intel
      # macOS and aarch64 Linux). A failure on either new arch
      # degrades to a 3-binary release rather than blocking the
      # whole tag.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: mty
            asset: mty-x86_64-unknown-linux-gnu.tar.gz
            use_cross: false
          # v0.32 (Track D): Intel macOS via cross-compile on Apple
          # Silicon runner. v0.32.1 pivoted from `macos-13` to
          # `macos-14` because GitHub Actions' free Intel runner
          # pool went indefinitely-queued in late May 2026 (jobs
          # sat >30min without allocation, blocking all v* tag
          # releases). Apple Silicon Xcode ships the x86_64-darwin
          # SDK; `cargo build --target x86_64-apple-darwin` works
          # fine on macos-14. Intel Macs still ~30% of macOS base;
          # this binary remains a hard requirement for the
          # homebrew-core submission.
          - os: macos-14
            target: x86_64-apple-darwin
            artifact: mty
            asset: mty-x86_64-apple-darwin.tar.gz
            use_cross: false
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: mty
            asset: mty-aarch64-apple-darwin.tar.gz
            use_cross: false
          # v0.32 (Track D): aarch64 Linux for Raspberry Pi 5, AWS
          # Graviton, Ampere Altra, and Apple Silicon Linux VMs.
          # Cross-compiled from ubuntu-latest via the `cross` tool
          # (`cargo install cross --version 0.2.5 --locked`) to
          # avoid paying for a GitHub-hosted arm64 Linux runner,
          # which is still preview / paid-tier only.
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: mty
            asset: mty-aarch64-unknown-linux-gnu.tar.gz
            use_cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: mty.exe
            asset: mty-x86_64-pc-windows-msvc.zip
            use_cross: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-release-

      - name: Install cross (aarch64 Linux only)
        if: matrix.use_cross == true
        # `cross` is pinned to 0.2.5 — last known-good release
        # against our Rust 1.95.0 toolchain. Bumping is fine but
        # do it deliberately so a `cross` regression doesn't break
        # the aarch64 release silently.
        run: cargo install cross --version 0.2.5 --locked

      - name: Build mty (release, native)
        if: matrix.use_cross == false
        run: cargo build --release --bin mty -p mty-cli --target ${{ matrix.target }}

      - name: Build mty (release, cross)
        if: matrix.use_cross == true
        run: cross build --release --bin mty -p mty-cli --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/mty-${{ github.ref_name }}
          cp target/${{ matrix.target }}/release/${{ matrix.artifact }} dist/mty-${{ github.ref_name }}/
          cp LICENSE README.md CHANGELOG.md dist/mty-${{ github.ref_name }}/
          tar -C dist -czf ${{ matrix.asset }} mty-${{ github.ref_name }}
          shasum -a 256 ${{ matrix.asset }} > ${{ matrix.asset }}.sha256

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "dist/mty-${{ github.ref_name }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.artifact }}" $stage
          Copy-Item LICENSE,README.md,CHANGELOG.md $stage
          Compress-Archive -Path $stage -DestinationPath "${{ matrix.asset }}"
          $hash = (Get-FileHash -Algorithm SHA256 "${{ matrix.asset }}").Hash.ToLower()
          "$hash  ${{ matrix.asset }}" | Out-File -Encoding ascii "${{ matrix.asset }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256

  conformance-kit:
    # v0.20: every tagged release ships a conformance kit alongside
    # the binaries so independent implementations can verify against
    # the exact spec / fixture set the binaries were built from.
    # The kit tarball is published as a GitHub Actions artifact AND
    # attached to the GitHub Release via the `release` job below.
    name: build conformance kit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Build conformance kit
        run: bash scripts/build-conformance-kit.sh ${{ github.event.inputs.tag || github.ref_name }}

      - name: List kit output
        run: ls -la mty-conformance-kit-*.tar.gz

      - name: Upload conformance kit artifact
        uses: actions/upload-artifact@v4
        with:
          name: conformance-kit
          path: mty-conformance-kit-*.tar.gz

  # v0.32 (Track D): Cosign sign + SBOM step for the official Docker
  # image. This job is GATED on the `PUBLISH_DOCKER` repo variable
  # because Docker push doesn't live in release.yml yet (it's a
  # manual step from `tools/distribution/README.md` runbook §4). When
  # the publish step is folded into release.yml in a future track,
  # flip `vars.PUBLISH_DOCKER` to `true` and this job will run with
  # no further edits.
  #
  # Keyless signing via GitHub OIDC is documented at
  # https://docs.sigstore.dev/cosign/signing/overview/. SBOM +
  # provenance attestations come from `docker buildx build` with
  # `--sbom=true --provenance=true`.
  docker-sign-sbom:
    name: cosign + sbom (docker)
    needs: [build]
    runs-on: ubuntu-latest
    if: ${{ vars.PUBLISH_DOCKER == 'true' }}
    permissions:
      contents: read
      id-token: write # for cosign keyless OIDC
      packages: write # for ghcr push
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute MTY_VERSION (strip leading v)
        id: ver
        run: |
          raw="${{ github.event.inputs.tag || github.ref_name }}"
          echo "value=${raw#v}" >> "$GITHUB_OUTPUT"

      - name: Build + push image with SBOM + provenance
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: tools/distribution/docker
          # NOTE: Dockerfile currently hard-codes the
          # `mty-x86_64-unknown-linux-gnu.tar.gz` asset URL, so
          # multi-platform = amd64-only until the Dockerfile is
          # rewritten to TARGETARCH-switch the asset name. v0.32
          # release.yml shipped the aarch64-linux binary so a v0.33
          # follow-up can flip this to `linux/amd64,linux/arm64`.
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: true
          build-args: |
            MTY_VERSION=${{ steps.ver.outputs.value }}
          tags: |
            ghcr.io/hassard0/mty:${{ steps.ver.outputs.value }}
            ghcr.io/hassard0/mty:latest

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1

      - name: Sign the image (keyless, GitHub OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
          DIGEST: ${{ steps.docker_build.outputs.digest }}
        run: |
          cosign sign --yes "ghcr.io/hassard0/mty@${DIGEST}"

  release:
    name: publish release
    needs: [build, conformance-kit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Flatten artifact layout
        run: |
          set -euo pipefail
          mkdir -p out
          find dist -type f \( -name "mty-*.tar.gz" -o -name "mty-*.zip" -o -name "*.sha256" -o -name "mty-conformance-kit-*.tar.gz" \) -exec cp {} out/ \;
          ls -la out/

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            out/mty-*.tar.gz
            out/mty-*.zip
            out/*.sha256
            out/mty-conformance-kit-*.tar.gz
