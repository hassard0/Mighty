[package]
name = "mty-codegen-llvm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Mighty LLVM codegen backend — scaffold only in slice 8 (A46)."

[features]
default = []
# Enable inkwell to build a real LLVM backend. Requires LLVM 17
# headers/libs available via llvm-config. See A46 — the v0.2 build
# host did not have LLVM installed, so this feature is OFF by default
# and Cranelift remains the default native backend. With LLVM 17
# installed on the host, `cargo build --features llvm` enables real
# IR emission and the LLVM PassBuilder optimizer pipeline.
llvm = ["dep:inkwell"]

[dependencies]
mty-ir = { path = "../mty-ir" }
mty-types = { path = "../mty-types" }
mty-hir = { path = "../mty-hir" }
mty-diagnostics = { path = "../mty-diagnostics" }
thiserror = { workspace = true }
inkwell = { workspace = true, optional = true }

[dev-dependencies]
# v0.37 T5 — U8-widening regression suite (feature-gated tests in
# `tests/u8_widening.rs`). The suite lowers small Mighty programs all
# the way through HIR → typeck → SIR → LLVM IR text, then greps the
# emitted IR for the expected unsigned intrinsics (zext / udiv / urem
# / icmp ult / lshr) — matches the cranelift backend's u8_widening.rs
# but checks IR shape instead of executing via JIT.
mty-syntax = { path = "../mty-syntax" }
mty-ast = { path = "../mty-ast" }
tempfile = "3"

[lints]
workspace = true
