[package]
name = "mty-stdlib"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
mty-types = { path = "../mty-types" }
mty-ir = { path = "../mty-ir" }
mty-runtime = { path = "../mty-runtime" }
mty-driver = { path = "../mty-driver", optional = true }
mty-diagnostics = { path = "../mty-diagnostics", optional = true }
serde_json.workspace = true
rustls = { workspace = true, features = ["ring"] }
rustls-pemfile.workspace = true
tokio-rustls.workspace = true
tokio.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
thiserror.workspace = true
# v0.14 — std.random backend (OS entropy). The transitive deps already
# pull getrandom in (via ring/rustls); pinning 0.2 here keeps us on
# the same major as what the rest of the workspace links against.
getrandom = "0.2"
# v0.26 Track C — std.memory backends.
# `rusqlite` is OPTIONAL behind the `memory-sqlite` feature so default
# builds don't add a libsqlite dep (and to keep wasm/no-libc targets
# compiling). Same story for OpenAI embeddings — the network egress is
# gated behind `memory-openai` so the default test harness is offline
# and deterministic. The local in-memory + JSON-on-disk vector backend
# and the in-memory episodic ring buffer are always available.
serde = { workspace = true }
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
# v0.26 Track A — std.llm backends.
#
# `bytes` + `futures-core`/`futures-util` + `async-stream` are the
# only hard deps for the typed shape layer + streaming primitive. The
# provider implementations sit on top of the workspace's existing
# `hyper` + `tokio-rustls` stack (we build a small HTTPS connector
# locally rather than pulling `hyper-rustls` in for one function).
# `async-trait` is what `LlmProvider`'s async fns desugar against,
# and `webpki-roots` ships the Mozilla CA bundle so production
# callers actually hitting api.anthropic.com can complete the
# handshake (tests target wiremock over plain HTTP and never touch
# this path). Anthropic gets the only "real" client today; OpenAI/
# Gemini/Bedrock ship as auth-only skeletons (v0.27 fleshes them
# out).
bytes = "1"
futures-core = "0.3"
futures-util = "0.3"
async-trait = "0.1"
async-stream = "0.3"
webpki-roots = "1"
# v0.27 — Bedrock SigV4 signing. `sha2` powers both the SHA-256
# canonical-request digest and the HMAC-SHA-256 derived-key chain;
# `hex` formats the digest hexadecimal for the Authorization header.
# `hmac` is implemented inline on top of `sha2` to keep the AWS dep
# tree out of the workspace (no `aws-sigv4` / `aws-smithy-*` chain).
sha2.workspace = true
hex.workspace = true
# v0.27 — Bedrock ConverseStream parses the AWS event-stream framing
# (a small binary protocol — 12-byte header + headers + payload + CRC).
# Implemented inline in `bedrock.rs`; no extra dep needed.

[features]
# `runner` pulls the full driver/diagnostics stack so `std.test`
# can lower + run Mighty source files. Default-on; downstream
# crates that only need json/tls/http/fs/time can disable it via
# `default-features = false` to keep their build small.
default = ["runner", "memory-sqlite"]
runner = ["dep:mty-driver", "dep:mty-diagnostics"]
# v0.26 Track C feature flags.
memory-sqlite = ["dep:rusqlite"]
memory-openai = []
memory-qdrant = []

[dev-dependencies]
tempfile = "3"
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
# v0.26 Track A — std.llm tests. `wiremock` spins a local HTTP mock
# server for the Anthropic client round-trip / tool-use / 429 /
# budget-exhaustion / streaming tests. Plain HTTP is fine because
# we exercise the request shaping + response parser layers (TLS
# handshake coverage lives in `tls_handshake.rs`).
wiremock = "0.6"

[[bin]]
name = "mty-test"
path = "src/bin/mty-test.rs"
required-features = ["runner"]

[lints]
workspace = true
