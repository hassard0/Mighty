name: "Mighty test"
description: >-
  Run the Mighty unit-test runner: `mty test` discovers `tests/*.test.mty`
  (and the legacy bare `tests/*.mty`) under the working directory and
  dispatches each through the SIR interpreter. Pair with the
  `setup-mty` composite action to put the binary on `$PATH` first.
  For LLM-eval suites (`**/*.eval.mty`), use the `mty-test-eval`
  composite action instead.
author: "Mighty"
branding:
  icon: "play"
  color: "purple"

inputs:
  manifest-dir:
    description: >-
      Override the discovery root passed to `mty test --manifest-dir`.
      Default: empty (uses the working directory). Useful for repos
      that keep their `tests/` outside the cwd.
    required: false
    default: ""
  format:
    description: >-
      Output format: `pretty` (default) or `json`. `json` emits one
      object per suite plus a summary so CI dashboards can read
      incrementally.
    required: false
    default: "pretty"
  working-directory:
    description: "Run `mty test` from this directory. Default: repo root."
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: mty test
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        MTY_MANIFEST_DIR: ${{ inputs.manifest-dir }}
        MTY_FORMAT: ${{ inputs.format }}
      run: |
        set -euo pipefail
        ARGS=("test" "--format" "${MTY_FORMAT}")
        if [ -n "${MTY_MANIFEST_DIR}" ]; then
          ARGS+=("--manifest-dir" "${MTY_MANIFEST_DIR}")
        fi
        echo "+ mty ${ARGS[*]}"
        mty "${ARGS[@]}"
