[package]
name = "sdust-stdlib"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
sdust-types = { path = "../sdust-types" }
sdust-sir = { path = "../sdust-sir" }
sdust-runtime = { path = "../sdust-runtime" }
sdust-driver = { path = "../sdust-driver", optional = true }
sdust-diagnostics = { path = "../sdust-diagnostics", optional = true }
serde_json.workspace = true
rustls = { workspace = true, features = ["ring"] }
rustls-pemfile.workspace = true
tokio-rustls.workspace = true
tokio.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
thiserror.workspace = true

[features]
# `runner` pulls the full driver/diagnostics stack so `std.test`
# can lower + run Stardust source files. Default-on; downstream
# crates that only need json/tls/http/fs/time can disable it via
# `default-features = false` to keep their build small.
default = ["runner"]
runner = ["dep:sdust-driver", "dep:sdust-diagnostics"]

[dev-dependencies]
tempfile = "3"
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }

[[bin]]
name = "sdust-test"
path = "src/bin/sdust-test.rs"
required-features = ["runner"]
