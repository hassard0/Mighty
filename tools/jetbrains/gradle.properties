# Mighty JetBrains plugin metadata.
#
# These values feed both build.gradle.kts (plugin coordinates) and plugin.xml
# (the <version> tag is rewritten by the IntelliJ Platform Gradle Plugin from
# pluginVersion below at build time, so plugin.xml itself contains a
# placeholder).

pluginGroup = dev.mighty.jetbrains
pluginName = Mighty
pluginVersion = 0.32.0

# Min IntelliJ Platform build. v0.32 drops to 232 (== 2023.2) because the
# LSP integration is now optional — Community editions load the plugin and
# get TextMate-grammar syntax highlighting + CLI actions, even though they
# can't activate the LSP-backed editor features. The LSP module is wired in
# via `<depends optional=...>` so the plugin self-discovers whether the host
# IDE actually ships `com.intellij.modules.lsp` at runtime.
pluginSinceBuild = 232
# Empty = no upper bound (forwards-compatible).
pluginUntilBuild =

# Target IDE we build against. IU = IntelliJ IDEA Ultimate, which is the
# minimum that ships the `com.intellij.platform.lsp.api` module our LSP
# integration compiles against. The resulting plugin still installs in
# Community editions thanks to the optional `<depends>` on the LSP module
# (LSP-dependent classes simply aren't loaded there).
platformType = IU
platformVersion = 2024.1

# Kotlin / Gradle settings.
kotlin.stdlib.default.dependency = false
org.gradle.parallel = true
org.gradle.caching = true
org.gradle.jvmargs = -Xmx2g -XX:+UseG1GC -Dfile.encoding=UTF-8
systemProp.file.encoding = UTF-8
