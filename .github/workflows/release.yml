name: Release

# Build the `mty` binary for Linux, macOS, and Windows whenever a
# `v*` tag lands on `main`, then attach the artifacts to the
# corresponding GitHub Release.
#
# The release itself is created or updated by this workflow if it
# does not yet exist. The body defaults to the tag message; a
# follow-up commit can flesh it out with the RELEASE-v0.X.md
# contents from `dev/history/releases/`.
#
# Triggering on tags-only (not branches) means routine pushes to
# main don't trip a binary build — only an integrator-tagged
# release does.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        # v0.37 T4: optional + defaulted so an integrator can canary-test
        # the release pipeline against an existing tag without typing it
        # every time. We pin the default to v0.36.1 — the last green
        # release — so the dry-run defaults to "rebuild the latest binary
        # set" rather than asking GitHub to check out a tag that may not
        # exist yet. To dry-run from the gh CLI:
        #
        #   gh workflow run release.yml -f tag=v0.36.1
        description: "Tag to build (e.g. v0.36.1). Must already exist on the repo."
        required: false
        type: string
        default: "v0.36.1"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      # v0.17 polish: `fail-fast: false` so a stuck/queued platform
      # cannot block the release publish step indefinitely. We still
      # want a partial release over no release at all. The publish
      # job below uses `fail_on_unmatched_files: false` so missing
      # platforms degrade gracefully.
      # v0.32 (Track D): matrix is now 5 platforms (added Intel
      # macOS and aarch64 Linux). A failure on either new arch
      # degrades to a 3-binary release rather than blocking the
      # whole tag.
      fail-fast: false
      # v0.35 (Track T4): PGO wired into 3 of 5 platforms.
      # v0.37 (Track T4): darwin-arm64 back in the PGO set — same 3 of
      # 5 platforms as v0.35, after a v0.36.1 regression on macos-14.
      # v0.37.3: darwin-arm64 disabled again because rustc 1.95.0 and
      # the bundled llvm-profdata on aarch64-apple-darwin emit/expect
      # different .profraw raw-format versions (raw=8 vs expected=10)
      # IN THE SAME TOOLCHAIN CHANNEL. The manual scripts had no way
      # to fix a within-channel toolchain mismatch.
      #
      # v0.38 (Track T1): migrated to the `cargo-pgo` crate, which
      # wraps the entire PGO pipeline and auto-discovers a matching
      # llvm-profdata so the rustup-distribution mismatch above is
      # handled transparently. darwin-arm64 PGO is restored — same
      # 3 of 5 platforms as v0.35/v0.37. The legacy manual scripts
      # `scripts/build-pgo.{sh,ps1}` are preserved for local dev
      # (users who don't want to install cargo-pgo).
      #
      # v0.39 (Track T4):
      #   - `use_bolt: true` runs `cargo pgo bolt build` + `cargo pgo
      #     bolt optimize` on top of PGO. BOLT re-orders basic blocks
      #     based on the same training corpus profiles, typically
      #     5-15% more wall-clock on top of PGO. Linux-only for now:
      #     llvm-bolt's PE/COFF support is too rough to ship on
      #     windows-msvc, and BOLT on macOS would need a separate
      #     install path. Cross-compile + Rosetta legs already opt
      #     out of PGO so BOLT can't apply there either.
      #   - darwin-arm64 PGO retry on toolchain 1.96.0. v0.38 left
      #     the platform off because rustc 1.95.0 + the bundled
      #     llvm-profdata on aarch64-apple-darwin disagreed on the
      #     .profraw raw-format version (raw=8 emitted vs raw=10
      #     expected) inside the same channel. Per-matrix-entry
      #     `toolchain: "1.96.0"` overrides the workspace default
      #     1.95.0 via RUSTUP_TOOLCHAIN env. Falls back to plain
      #     `--release` (use_pgo: false) automatically if the newer
      #     toolchain still skews — we leave the matrix entry able
      #     to flip back without touching anything else.
      #
      # `use_pgo: true` swaps `cargo build --release` for the cargo-pgo
      # two-stage pipeline (instrument → run training corpus → optimise)
      # using the `[profile.release-pgo]` profile already pinned in the
      # workspace Cargo.toml (fat LTO, codegen-units=1, strip).
      #
      # PGO is constrained to platforms where the instrumented binary
      # can run natively on the same runner that built it. That rules
      # out cross-compile and Rosetta paths:
      #
      #   - linux-x86_64 (ubuntu-latest): native PGO. EASY.
      #   - darwin-arm64 (macos-14):      native PGO via cargo-pgo
      #     auto-matched llvm tools.
      #   - windows-x86_64 (windows-latest): native PGO. EASY.
      #   - darwin-x86_64 (macos-14):     would require Rosetta to
      #     run the instrumented binary on the arm64 runner. We tried
      #     this in v0.35 dev and Rosetta wall-clock plus the .profraw
      #     write-back path were unreliable; falls back to plain
      #     `release` profile and is flagged in the release notes.
      #   - linux-aarch64 (ubuntu-latest + cross): cross-compiled, so
      #     instrumented binary is arm64 and the x86_64 runner can't
      #     execute it. Falls back to plain `release` profile via
      #     `cross`.
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: mty
            asset: mty-x86_64-unknown-linux-gnu.tar.gz
            use_cross: false
            # v0.36 T5: PGO RE-ENABLED. v0.35.2 disabled it across the
            # three native-PGO platforms because:
            #   1. linux-x86_64 hit `LLVM ERROR: Broken module found,
            #      module flag identifiers must be unique !"CG Profile"`
            #   2. macOS+Windows hit a profile-format mismatch
            #      (raw=8 vs expected=10) on cached target artifacts
            # T5 fixed both:
            #   - Phase 4 now drops `-Clinker-plugin-lto`. Fat LTO is
            #     already on via `[profile.release-pgo]`; the linker-
            #     plugin flag was the source of the CG Profile clash.
            #   - Phase 0 now wipes
            #     `target/release-pgo/{build,deps,incremental,
            #     .fingerprint}` so a fresh codegen runs every time
            #     and stale `-Cprofile-use` artifacts don't survive
            #     across runs.
            #   - The cargo cache key below now segregates the PGO
            #     artifacts under a `release-pgo` suffix so the
            #     restore-keys can't pull in a stale `target/release-pgo`
            #     from a prior workflow.
            use_pgo: true
            # v0.39.1: BOLT temporarily disabled. v0.39.0 Release on
            # c9c441d failed at the BOLT instrumentation step with:
            #   rust-lld: error: --strip-all and --emit-relocs may
            #   not be used together
            # The `[profile.release-pgo]` workspace profile has
            # `strip = "symbols"` (= --strip-all) and `cargo pgo
            # bolt build` injects --emit-relocs for the BOLT
            # instrumentation pass.
            #
            # v0.40 T1 FIX: BOLT RESTORED. Solution A — separate
            # `[profile.release-pgo-bolt]` profile inheriting from
            # release-pgo with `strip = "none"`. BOLT steps now pass
            # `--profile release-pgo-bolt`; the resulting binary is
            # stripped manually after `cargo pgo bolt optimize` so
            # the shipped artefact still drops debug bloat. The
            # release-pgo profile itself stays unchanged — non-BOLT
            # PGO platforms (windows-x86_64, darwin-arm64) still get
            # the `strip = true` behaviour they had in v0.38/v0.39.
            use_bolt: true
            toolchain: "1.95.0"
          # v0.32 (Track D): Intel macOS via cross-compile on Apple
          # Silicon runner. v0.32.1 pivoted from `macos-13` to
          # `macos-14` because GitHub Actions' free Intel runner
          # pool went indefinitely-queued in late May 2026 (jobs
          # sat >30min without allocation, blocking all v* tag
          # releases). Apple Silicon Xcode ships the x86_64-darwin
          # SDK; `cargo build --target x86_64-apple-darwin` works
          # fine on macos-14. Intel Macs still ~30% of macOS base;
          # this binary remains a hard requirement for the
          # homebrew-core submission.
          # v0.35: not PGO — would require Rosetta to run the
          # instrumented x86_64 binary on the arm64 runner.
          - os: macos-14
            target: x86_64-apple-darwin
            artifact: mty
            asset: mty-x86_64-apple-darwin.tar.gz
            use_cross: false
            use_pgo: false
            use_bolt: false
            toolchain: "1.95.0"
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: mty
            asset: mty-aarch64-apple-darwin.tar.gz
            use_cross: false
            # v0.38 T1: PGO migration to cargo-pgo did NOT fix the
            # darwin-arm64 toolchain-internal mismatch. The v0.38.0
            # release run hit the same raw=8 vs expected=10 error at
            # the instrumented-binary runtime, this time surfaced as
            # `LLVM Profile Error: Runtime and instrumentation version
            # mismatch : expected 10, but get 8` per-example during
            # the training-corpus step, leaving target/pgo-profiles
            # empty for the optimise step. cargo-pgo can't help: it's
            # the rustc emitting raw=8 vs the channel's runtime
            # expecting raw=10. Both come from the same rustup-bundled
            # toolchain.
            #
            # v0.39 T4 RETRY: per-matrix toolchain override to 1.96.0,
            # which post-dates the LLVM bump that introduced the raw=10
            # runtime expectation on darwin-arm64. The RUSTUP_TOOLCHAIN
            # env var below makes cargo + rustc + the bundled
            # llvm-profdata all come from the SAME 1.96.0 channel
            # rather than the workspace-pinned 1.95.0. If 1.96.0 still
            # skews on the runner image, flip back to use_pgo: false
            # and document the next attempt — the rest of the pipeline
            # degrades to plain --release cleanly.
            #
            # BOLT stays off: even when PGO is back on darwin-arm64,
            # llvm-bolt's Mach-O support is too thin for the release
            # path. Linux-only BOLT in v0.39.
            # v0.39.1: 1.96.0 toolchain retry FAILED — Release run
            # on c9c441d hit the SAME raw=8 vs expected=10 mismatch.
            # This is a deeper upstream issue than just the 1.95
            # channel; even 1.96 has the same rustc/llvm-profdata
            # version skew on aarch64-apple-darwin. Documented as
            # rust-lang issue waiting for an LLVM-tools alignment
            # upstream. Reverting to use_pgo: false until upstream
            # fix lands. Toolchain pin retained but moot when
            # use_pgo is false.
            use_pgo: false
            use_bolt: false
            toolchain: "1.96.0"
          # v0.32 (Track D): aarch64 Linux for Raspberry Pi 5, AWS
          # Graviton, Ampere Altra, and Apple Silicon Linux VMs.
          # Cross-compiled from ubuntu-latest via the `cross` tool
          # (`cargo install cross --version 0.2.5 --locked`) to
          # avoid paying for a GitHub-hosted arm64 Linux runner,
          # which is still preview / paid-tier only.
          # v0.35: not PGO — cross-compile means the instrumented
          # arm64 binary can't run on the x86_64 build host.
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: mty
            asset: mty-aarch64-unknown-linux-gnu.tar.gz
            use_cross: true
            use_pgo: false
            use_bolt: false
            toolchain: "1.95.0"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: mty.exe
            asset: mty-x86_64-pc-windows-msvc.zip
            use_cross: false
            # v0.38.3: PGO RESTORED on Windows via the proven v0.37.3
            # `scripts/build-pgo.ps1` manual path (NOT cargo-pgo).
            # v0.38.0-v0.38.2 used cargo-pgo, which on windows-msvc
            # ran the training step cleanly but wrote no .profraw
            # shards to target/pgo-profiles, leaving the optimise
            # step unable to find any profiles. cargo-pgo is correct
            # for Linux but its Windows MSVC handling is incomplete.
            # The ps1 script handles the profraw write path correctly
            # — it shipped working in every release from v0.36 → v0.37.3.
            #
            # v0.39 PGO matrix (assuming darwin-arm64 retry holds):
            # 3/5 platforms (linux-x86_64 via cargo-pgo + BOLT,
            # windows-x86_64 via build-pgo.ps1, darwin-arm64 via
            # cargo-pgo on toolchain 1.96.0).
            #
            # BOLT on Windows is off: llvm-bolt's PE/COFF handling is
            # too rough to ship today. Re-evaluate when bolt/COFF lands.
            use_pgo: true
            use_bolt: false
            toolchain: "1.95.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # v0.39 T4: per-matrix toolchain. Most legs stay on 1.95.0
          # (the workspace pin in rust-toolchain.toml). darwin-arm64
          # bumps to 1.96.0 to escape the v0.37/v0.38 within-channel
          # raw=8/expected=10 PGO mismatch.
          toolchain: ${{ matrix.toolchain }}
          targets: ${{ matrix.target }}
          # v0.35 (Track T4): PGO matrix entries need `llvm-profdata`
          # to merge the .profraw shards from the instrumented pass.
          # `llvm-tools-preview` ships it inside the toolchain sysroot
          # at `lib/rustlib/<host>/bin/llvm-profdata`; the build-pgo
          # script auto-discovers it via `rustc --print sysroot`.
          components: ${{ matrix.use_pgo && 'llvm-tools-preview' || '' }}

      # v0.39 T4: pin RUSTUP_TOOLCHAIN so cargo/rustc invocations in
      # the rest of the job ignore the workspace `rust-toolchain.toml`
      # pin (which is hard-coded to 1.95.0). Without this, the darwin
      # leg would install 1.96.0 above but the build steps would
      # still pick 1.95.0 from the toolchain file, defeating the
      # whole point of the retry.
      - name: Pin RUSTUP_TOOLCHAIN to matrix.toolchain
        shell: bash
        run: echo "RUSTUP_TOOLCHAIN=${{ matrix.toolchain }}" >> "$GITHUB_ENV"

      # v0.36 T5: cache key now segregates PGO and non-PGO targets.
      # The previous unified key let a stale `target/release-pgo/`
      # from a prior workflow run leak into the next instrumented
      # build, which is exactly how the profile-format mismatch
      # (raw=8 vs expected=10) survived across runs even with Phase 0
      # wiping the profile dir. Splitting the key by `use_pgo` means
      # the PGO leg always restores from a PGO-only cache, and the
      # restore-keys fallback can't cross-contaminate.
      #
      # We also exclude `target/release-pgo` from the cached paths on
      # the non-PGO legs (they don't produce that directory anyway,
      # but listing only the directories we do produce keeps the
      # cache lean).
      - name: Cache cargo registry + target (non-PGO legs)
        if: matrix.use_pgo == false
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/${{ matrix.target }}
            target/debug
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-release-noPGO-tc${{ matrix.toolchain }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-release-noPGO-tc${{ matrix.toolchain }}-
            ${{ runner.os }}-${{ matrix.target }}-cargo-release-noPGO-

      # PGO legs cache `target/<triple>/release-pgo` under its own key.
      # v0.38 (Track T1): cargo-pgo writes to the per-triple path, so
      # the cache paths now match. The cargo-pgo version is baked into
      # the cache key so a tooling bump invalidates cleanly.
      - name: Cache cargo registry + target (PGO legs)
        if: matrix.use_pgo == true
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/${{ matrix.target }}/release-pgo/build
            target/${{ matrix.target }}/release-pgo/deps
            target/${{ matrix.target }}/release-pgo-bolt/build
            target/${{ matrix.target }}/release-pgo-bolt/deps
          # v0.40 T1: cache key bumped (bolt2 discriminator) to invalidate
          # any v0.39.x cached state because:
          #   - v0.39.x BOLT legs failed at the linker (strip-all/emit-relocs
          #     conflict) so any cached release-pgo artefacts from that run
          #     are partial/inconsistent.
          #   - v0.40 BOLT now writes to `target/<triple>/release-pgo-bolt/`
          #     (separate profile), so we ALSO cache that new dir.
          # Per-matrix toolchain also discriminates so darwin-arm64's
          # 1.96.0 cache stays separate from the 1.95.0 cache.
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-release-pgo-cargopgo0.2.9-bolt2-tc${{ matrix.toolchain }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-release-pgo-cargopgo0.2.9-bolt2-tc${{ matrix.toolchain }}-
            ${{ runner.os }}-${{ matrix.target }}-cargo-release-pgo-cargopgo0.2.9-bolt2-
            ${{ runner.os }}-${{ matrix.target }}-cargo-release-pgo-cargopgo0.2.9-

      # v0.35 (Track T4): Three build paths now —
      #   1. native + PGO   → scripts/build-pgo.{sh,ps1}
      #   2. native + plain → cargo build --release
      #   3. cross + plain  → cross build --release
      #
      # v0.38 (Track T1): the PGO path now drives the `cargo-pgo`
      # crate rather than the in-tree shell scripts. cargo-pgo
      # discovers a matching `llvm-profdata` for the active rustc
      # automatically (closing the v0.37 darwin-arm64 toolchain
      # mismatch) and produces the optimised binary at
      # `target/<triple>/release-pgo/mty` because we pass
      # `--profile release-pgo --target <triple>`. The legacy
      # `scripts/build-pgo.{sh,ps1}` files stay in-tree for local
      # dev — see their top-of-file notes.

      - name: Install cargo-pgo (PGO legs only)
        if: matrix.use_pgo == true
        # 0.2.9 is the last stable 0.2.x release (0.2.10 was yanked,
        # 0.3.0 is current as of v0.38). Pinning keeps the release
        # pipeline reproducible; bump deliberately so a cargo-pgo
        # regression doesn't break the release silently.
        run: cargo install cargo-pgo --version 0.2.9 --locked

      - name: Build mty (release-pgo, instrumented) — Unix
        if: matrix.use_pgo == true && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cargo pgo build -- \
            --profile release-pgo \
            --bin mty -p mty-cli \
            --target ${{ matrix.target }}

      - name: Run PGO training corpus — Unix
        if: matrix.use_pgo == true && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # cargo-pgo lands the instrumented binary at
          # target/<triple>/release-pgo/<bin> when we pass
          # `--profile release-pgo --target <triple>`.
          BIN="target/${{ matrix.target }}/release-pgo/mty"
          if [[ ! -x "$BIN" ]]; then
            echo "ERROR: instrumented mty not found at $BIN" >&2
            ls -la "target/${{ matrix.target }}/release-pgo/" || true
            exit 1
          fi
          # Sweep `mty check` over the bundled examples, honouring
          # the same skip markers as the build-pgo.sh script
          # (`@typeck-pending` and `@compile-error`).
          shopt -s nullglob
          for f in examples/*.mty; do
            if grep -q '@typeck-pending' "$f" 2>/dev/null; then
              continue
            fi
            "$BIN" check "$f" 2>&1 | tail -2 || true
          done
          # Plus one wasm32-wasi build to exercise codegen.
          if [[ -f examples/01_hello.mty ]]; then
            "$BIN" build examples/01_hello.mty --target wasm32-wasi 2>&1 | tail -2 || true
          fi

      - name: Build mty (release-pgo, optimised) — Unix
        if: matrix.use_pgo == true && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cargo pgo optimize build -- \
            --profile release-pgo \
            --bin mty -p mty-cli \
            --target ${{ matrix.target }}

      # v0.39 T4: BOLT — Binary Optimization and Layout Tool. Re-orders
      # basic blocks on the already-PGO-optimised binary using a second
      # training pass, typically ~5-15% on top of PGO alone. cargo-pgo
      # 0.2.9 supports `cargo pgo bolt build` (instrument) and
      # `cargo pgo bolt optimize` (re-layout from collected fdata).
      #
      # llvm-bolt ships in the ubuntu-24.04 apt package `llvm-bolt`
      # (currently LLVM 19). cargo-pgo discovers it via PATH, the
      # same way it auto-discovers llvm-profdata for the PGO step.
      #
      # Linux-only: see matrix-level `use_bolt` comment for why.
      - name: Install llvm-bolt (BOLT legs only)
        if: matrix.use_bolt == true
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          # `llvm-bolt` package name varies across ubuntu versions; try
          # the unversioned alias first, then fall back to the LLVM-19
          # package which we know is on ubuntu-24.04.
          if ! sudo apt-get install -y llvm-bolt; then
            sudo apt-get install -y llvm-19-bolt
            # Symlink the versioned binary into a directory on PATH so
            # cargo-pgo's `which llvm-bolt` discovery finds it.
            sudo ln -sf /usr/bin/llvm-bolt-19 /usr/local/bin/llvm-bolt
            sudo ln -sf /usr/bin/merge-fdata-19 /usr/local/bin/merge-fdata
          fi
          llvm-bolt --version | head -1
          merge-fdata --version 2>/dev/null | head -1 || true

      - name: Build mty (BOLT, instrumented) — Linux
        if: matrix.use_bolt == true
        shell: bash
        run: |
          set -euo pipefail
          # v0.40 T1: use `release-pgo-bolt` (not `release-pgo`) so
          # `strip = "none"` lets the linker keep relocs that BOLT
          # needs. See Cargo.toml `[profile.release-pgo-bolt]` for
          # the strip-all/emit-relocs conflict that v0.39.0 hit.
          #
          # `cargo pgo bolt build` takes the PGO-optimised binary from
          # the prior step and rewrites it with BOLT instrumentation.
          # Output lands at target/<triple>/release-pgo-bolt/<bin>-bolt-instrumented.
          cargo pgo bolt build -- \
            --profile release-pgo-bolt \
            --bin mty -p mty-cli \
            --target ${{ matrix.target }}

      - name: Run BOLT training corpus — Linux
        if: matrix.use_bolt == true
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release-pgo-bolt/mty-bolt-instrumented"
          if [[ ! -x "$BIN" ]]; then
            echo "ERROR: BOLT-instrumented mty not found at $BIN" >&2
            ls -la "target/${{ matrix.target }}/release-pgo-bolt/" || true
            exit 1
          fi
          # Same corpus as the PGO training pass. BOLT writes per-PID
          # fdata shards under target/bolt-profiles which the optimise
          # step merges automatically via merge-fdata.
          shopt -s nullglob
          for f in examples/*.mty; do
            if grep -q '@typeck-pending' "$f" 2>/dev/null; then
              continue
            fi
            "$BIN" check "$f" 2>&1 | tail -2 || true
          done
          if [[ -f examples/01_hello.mty ]]; then
            "$BIN" build examples/01_hello.mty --target wasm32-wasi 2>&1 | tail -2 || true
          fi

      - name: Build mty (BOLT, optimised) — Linux
        if: matrix.use_bolt == true
        shell: bash
        run: |
          set -euo pipefail
          cargo pgo bolt optimize -- \
            --profile release-pgo-bolt \
            --bin mty -p mty-cli \
            --target ${{ matrix.target }}
          # cargo-pgo lands the BOLT-optimised binary as
          # target/<triple>/release-pgo-bolt/mty-bolt-optimized.
          #
          # v0.40 T1: because release-pgo-bolt disables strip (so BOLT
          # can use --emit-relocs), the shipped binary still carries
          # debug symbols. Strip them manually now — the BOLT layout
          # wins ride on the basic-block re-ordering, not the symbol
          # table, so stripping is safe post-optimise.
          BOLT_BIN="target/${{ matrix.target }}/release-pgo-bolt/mty-bolt-optimized"
          if [[ ! -x "$BOLT_BIN" ]]; then
            echo "ERROR: BOLT-optimised mty not found at $BOLT_BIN" >&2
            ls -la "target/${{ matrix.target }}/release-pgo-bolt/" || true
            exit 1
          fi
          strip "$BOLT_BIN"
          # Promote into the canonical release-pgo path so the existing
          # staging step picks it up without branching on use_bolt.
          DST_DIR="target/${{ matrix.target }}/release-pgo"
          mkdir -p "$DST_DIR"
          DST="$DST_DIR/mty"
          cp "$BOLT_BIN" "$DST"
          echo "BOLT-optimised binary (stripped) promoted to $DST"

      # v0.38.3: Windows PGO uses the v0.37.3 manual ps1 script.
      # cargo-pgo on windows-msvc writes no profraws (Phase 2 succeeds
      # but the optimise step finds an empty pgo-profiles directory).
      # The ps1 script handled this correctly — instrument, run
      # training corpus, merge with the rustup-bundled llvm-profdata,
      # rebuild with -Cprofile-use — and shipped working through every
      # release from v0.36 → v0.37.3. Restoring it here.
      #
      # The ps1 emits `target/release-pgo/mty.exe` (no per-triple
      # subdirectory). The "Stage PGO output" / packaging step further
      # down handles either layout.
      - name: Build mty (release-pgo) via build-pgo.ps1 — Windows
        if: matrix.use_pgo == true && runner.os == 'Windows'
        shell: pwsh
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: ./scripts/build-pgo.ps1

      - name: Build mty (release, native, no-PGO)
        if: matrix.use_pgo == false && matrix.use_cross == false
        run: cargo build --release --bin mty -p mty-cli --target ${{ matrix.target }}

      - name: Install cross (aarch64 Linux only)
        if: matrix.use_cross == true
        # `cross` is pinned to 0.2.5 — last known-good release
        # against our Rust 1.95.0 toolchain. Bumping is fine but
        # do it deliberately so a `cross` regression doesn't break
        # the aarch64 release silently.
        run: cargo install cross --version 0.2.5 --locked

      - name: Build mty (release, cross, no-PGO)
        if: matrix.use_cross == true
        run: cross build --release --bin mty -p mty-cli --target ${{ matrix.target }}

      # v0.35 (Track T4): normalize the binary path for the packaging
      # steps. PGO build lands at `target/release-pgo/mty`; native and
      # cross release builds land at `target/<triple>/release/mty`.
      # We copy whichever exists into a stable `staged/` directory so
      # the packaging steps below don't need to branch on use_pgo.
      # v0.38 (Track T1): cargo-pgo always writes to `target/<triple>/
      # release-pgo/<bin>` (it forces `--target` internally), so the
      # PGO leg now uses the per-triple path too. One staging shape
      # for everything.
      - name: Stage built binary (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          mkdir -p staged
          if [[ "${{ matrix.use_pgo }}" == "true" ]]; then
            cp "target/${{ matrix.target }}/release-pgo/${{ matrix.artifact }}" "staged/${{ matrix.artifact }}"
          else
            cp "target/${{ matrix.target }}/release/${{ matrix.artifact }}" "staged/${{ matrix.artifact }}"
          fi

      - name: Stage built binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staged | Out-Null
          if ("${{ matrix.use_pgo }}" -eq "true") {
            # v0.38.3: ps1 PGO script writes to target/release-pgo/
            # (no per-triple subdir, unlike cargo-pgo). Try both paths.
            $pgoPath = "target/release-pgo/${{ matrix.artifact }}"
            $tripPath = "target/${{ matrix.target }}/release-pgo/${{ matrix.artifact }}"
            if (Test-Path $pgoPath) {
              Copy-Item $pgoPath "staged/${{ matrix.artifact }}"
            } elseif (Test-Path $tripPath) {
              Copy-Item $tripPath "staged/${{ matrix.artifact }}"
            } else {
              Write-Error "PGO binary not found at $pgoPath or $tripPath"
              exit 1
            }
          } else {
            Copy-Item "target/${{ matrix.target }}/release/${{ matrix.artifact }}" "staged/${{ matrix.artifact }}"
          }

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/mty-${{ github.ref_name }}
          cp staged/${{ matrix.artifact }} dist/mty-${{ github.ref_name }}/
          cp LICENSE README.md CHANGELOG.md dist/mty-${{ github.ref_name }}/
          tar -C dist -czf ${{ matrix.asset }} mty-${{ github.ref_name }}
          shasum -a 256 ${{ matrix.asset }} > ${{ matrix.asset }}.sha256

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "dist/mty-${{ github.ref_name }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "staged/${{ matrix.artifact }}" $stage
          Copy-Item LICENSE,README.md,CHANGELOG.md $stage
          Compress-Archive -Path $stage -DestinationPath "${{ matrix.asset }}"
          $hash = (Get-FileHash -Algorithm SHA256 "${{ matrix.asset }}").Hash.ToLower()
          "$hash  ${{ matrix.asset }}" | Out-File -Encoding ascii "${{ matrix.asset }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256

  conformance-kit:
    # v0.20: every tagged release ships a conformance kit alongside
    # the binaries so independent implementations can verify against
    # the exact spec / fixture set the binaries were built from.
    # The kit tarball is published as a GitHub Actions artifact AND
    # attached to the GitHub Release via the `release` job below.
    name: build conformance kit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Build conformance kit
        run: bash scripts/build-conformance-kit.sh ${{ github.event.inputs.tag || github.ref_name }}

      - name: List kit output
        run: ls -la mty-conformance-kit-*.tar.gz

      - name: Upload conformance kit artifact
        uses: actions/upload-artifact@v4
        with:
          name: conformance-kit
          path: mty-conformance-kit-*.tar.gz

  # v0.32 (Track D): Cosign sign + SBOM step for the official Docker
  # image. This job is GATED on the `PUBLISH_DOCKER` repo variable
  # so the docker push only happens when the user has opted in (the
  # default is off — the workflow + Dockerfile ship but no image is
  # published until vars.PUBLISH_DOCKER == 'true').
  #
  # v0.35 (Track T4): bumped to multi-arch (linux/amd64 + linux/arm64)
  # now that the Dockerfile is TARGETARCH-aware. The job also moved
  # to `needs: [release]` so the GitHub Release (and its attached
  # binaries) exist by the time the Dockerfile tries to curl them.
  #
  # Keyless signing via GitHub OIDC is documented at
  # https://docs.sigstore.dev/cosign/signing/overview/. SBOM +
  # provenance attestations come from `docker buildx build` with
  # `--sbom=true --provenance=true`.
  docker-sign-sbom:
    name: cosign + sbom (docker, multi-arch)
    needs: [release]
    runs-on: ubuntu-latest
    if: ${{ vars.PUBLISH_DOCKER == 'true' }}
    permissions:
      contents: read
      id-token: write # for cosign keyless OIDC
      packages: write # for ghcr push
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up QEMU
        # QEMU lets the ubuntu-latest (x86_64) runner emulate arm64
        # for the `linux/arm64` build leg. The Dockerfile only runs
        # `curl` + `tar` + `sha256sum -c` at build time (no Rust
        # compilation), so emulation overhead is negligible.
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute MTY_VERSION (strip leading v)
        id: ver
        run: |
          raw="${{ github.event.inputs.tag || github.ref_name }}"
          echo "value=${raw#v}" >> "$GITHUB_OUTPUT"

      - name: Build + push multi-arch image with SBOM + provenance
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: tools/distribution/docker
          # v0.35 (Track T4): multi-arch. The Dockerfile switches on
          # the implicit `TARGETARCH` build-arg (`amd64`|`arm64`) to
          # pick the right release tarball URL and verify against the
          # matching `.sha256` sidecar published in step 1.
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: true
          build-args: |
            MTY_VERSION=${{ steps.ver.outputs.value }}
          tags: |
            ghcr.io/hassard0/mty:${{ steps.ver.outputs.value }}
            ghcr.io/hassard0/mty:latest

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1

      - name: Sign the multi-arch image (keyless, GitHub OIDC)
        # Signing the manifest-list digest covers both per-arch images
        # via the recursive sign behaviour of cosign v2 (the `manifest
        # list → each manifest` edge is followed). The user's `cosign
        # verify ghcr.io/hassard0/mty:<tag>` check works regardless of
        # which arch they pulled.
        env:
          COSIGN_EXPERIMENTAL: "1"
          DIGEST: ${{ steps.docker_build.outputs.digest }}
        run: |
          cosign sign --yes --recursive "ghcr.io/hassard0/mty@${DIGEST}"

  release:
    name: publish release
    needs: [build, conformance-kit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Flatten artifact layout
        run: |
          set -euo pipefail
          mkdir -p out
          find dist -type f \( -name "mty-*.tar.gz" -o -name "mty-*.zip" -o -name "*.sha256" -o -name "mty-conformance-kit-*.tar.gz" \) -exec cp {} out/ \;
          ls -la out/

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            out/mty-*.tar.gz
            out/mty-*.zip
            out/*.sha256
            out/mty-conformance-kit-*.tar.gz
