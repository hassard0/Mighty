name: Pages

# v0.9 RC-prep — build + deploy the docs site to GitHub Pages on
# every push to main. The site is published at
# https://hassard0.github.io/Mighty/.
#
# The corpus is the `docs/` tree at the repo root, rendered by
# mkdocs-material (pure-Python; no Ruby runtime needed). Site
# configuration lives in `mkdocs.yml`.
#
# v0.35 T1 — the browser-based Mighty playground is now built into
# `tools/playground/build/` via `wasm-pack` + `vite build` and is
# mounted at `https://hassard0.github.io/Mighty/playground/`. See
# `tools/playground/README.md` and `crates/mty-cli/src/playground.rs`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Cancel any in-flight Pages deploy when a new commit lands — we
# only ever want the latest main on the public site.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build (mkdocs + playground)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- mkdocs site -------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-mkdocs-material
          restore-keys: ${{ runner.os }}-pip-

      - name: Install mkdocs-material
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            mkdocs==1.6.1 \
            mkdocs-material==9.5.49 \
            pymdown-extensions==10.14.3 \
            "Pygments<2.19"

      - name: mkdocs build (strict)
        # v0.10 polish: `--strict` is now enabled. The v0.9 corpus had
        # ~55 broken internal links (source-tree references, stale
        # root-of-repo notes, and `.sd`/`.mty` extension mismatches);
        # all have been migrated to GitHub blob URLs or fixed inline.
        # Future PRs that introduce a broken link will fail this job.
        run: mkdocs build --strict --site-dir site/

      # ---- playground build (wasm-pack + vite) -------------------------
      #
      # The playground compiles the lightweight Mighty front-end
      # (parser → HIR → typeck → borrowck → tree-walk interpreter) to
      # wasm32-unknown-unknown via wasm-pack, then bundles it into a
      # static site under `tools/playground/build/`. We mount that under
      # `site/playground/` so the Pages deploy serves both.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-playground-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-playground-

      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          fi
          wasm-pack --version

      - name: wasm-pack build (mty-cli playground)
        # wasm-pack forwards everything after `--` to `cargo build`.
        # We need `--no-default-features --features playground-wasm`
        # on the cargo side so the host-toolchain (codegen/runtime/
        # tokio/hyper) deps stay out of the wasm crate graph. See
        # `crates/mty-cli/Cargo.toml`'s `host-toolchain` feature.
        run: |
          cd crates/mty-cli
          wasm-pack build --target web \
            -d ../../tools/playground/public/wasm \
            -- --no-default-features --features playground-wasm

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tools/playground/package-lock.json

      - name: npm install (playground)
        run: cd tools/playground && npm ci

      - name: typecheck + build playground
        run: |
          cd tools/playground
          npm run typecheck
          npm run build

      - name: Merge playground into site/
        run: |
          mkdir -p site/playground
          cp -r tools/playground/build/* site/playground/

      # ---- gallery (static index) -------------------------------------
      #
      # If tools/gallery/ exists, mirror it under site/gallery/ so the
      # playground's "more examples" link resolves on the deployed site.
      - name: Merge gallery into site/
        run: |
          if [ -d tools/gallery ]; then
            mkdir -p site/gallery
            cp -r tools/gallery/* site/gallery/ || true
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
