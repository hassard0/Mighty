[package]
name = "mty-codegen-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Mighty Wasm core-module codegen backend — slice 8."

[dependencies]
mty-ir = { path = "../mty-ir" }
mty-types = { path = "../mty-types" }
mty-hir = { path = "../mty-hir" }
mty-diagnostics = { path = "../mty-diagnostics" }
mty-debuginfo = { path = "../mty-debuginfo" }
wasm-encoder = { workspace = true }
wasmparser = { workspace = true }
wit-component = { workspace = true }
wit-parser = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
wasmtime = { version = "36", default-features = false, features = ["cranelift", "runtime"] }
# v0.14 — preview2 integration tests pin the codegen-side P2 import
# constants against the stdlib-side ones to catch drift between
# `mty_codegen_wasm::P2DirectImport` and `mty_stdlib::random/time`.
mty-stdlib = { path = "../mty-stdlib", default-features = false }

[features]
# v0.14 opt-in feature for spinning up a `wasmtime-wasi` host and
# instantiating the adapter-wrapped component end-to-end. Off by
# default to keep `cargo test --workspace` fast; turn on with
# `--features wasmtime_p2_smoke` to exercise the smoke test (which
# pulls in ~80 transitive deps via wasmtime-wasi).
wasmtime_p2_smoke = []

[lints]
workspace = true
