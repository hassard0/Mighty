name: Python second-impl

# Runs the pure-Python reference implementation of the Mighty
# front-end (lexer + parser). This is the v1.0 spec-validation
# second-implementation; it imports nothing from the Rust source
# under crates/mty-syntax or selfhost/.
#
# Triggered when the Python impl OR the spec changes; the spec gate
# catches the case where a spec edit unintentionally breaks the
# secondary implementation, which is the whole point of having one.

on:
  push:
    branches: [main]
    paths:
      - 'impl-py/**'
      - 'docs/spec/**'
      - 'examples/**'
      - '.github/workflows/python-impl.yml'
  pull_request:
    branches: [main]
    paths:
      - 'impl-py/**'
      - 'docs/spec/**'
      - 'examples/**'
      - '.github/workflows/python-impl.yml'

jobs:
  test:
    name: pytest (py${{ matrix.python }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run impl-py test suite
        run: python -m pytest impl-py/tests/ -v
