[workspace]
resolver = "2"
members = [
    "crates/mty-syntax",
    "crates/mty-ast",
    "crates/mty-diagnostics",
    "crates/mty-hir",
    "crates/mty-types",
    "crates/mty-borrow",
    "crates/mty-ir",
    "crates/mty-runtime",
    "crates/mty-codegen-cranelift",
    "crates/mty-codegen-wasm",
    "crates/mty-codegen-llvm",
    "crates/mty-fmt",
    "crates/mty-lsp",
    "crates/mty-pkg",
    "crates/mty-doc",
    "crates/mty-stdlib",
    "crates/mty-debuginfo",
    "crates/mty-macros",
    "crates/mty-bench",
    "crates/mty-driver",
    "crates/mty-cli",
]

# v0.30 Track B: the SWE-bench harness is its own crate with heavy
# deps (reqwest, parquet readers) that would slow every workspace
# build. It lives at `bench/swe/` and is built independently:
#   cd bench/swe && cargo build --release
exclude = ["bench/swe"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/hassard0/Mighty"
authors = ["Ian Hassard <ihassard@gmail.com>"]

[workspace.dependencies]
logos = "0.14"
rowan = "0.15"
la-arena = "0.3"
ariadne = "0.4"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "1"
insta = { version = "1", features = ["yaml"] }
tokio = { version = "1", features = ["rt-multi-thread", "rt", "macros", "time", "net", "io-util", "sync", "fs"] }
parking_lot = "0.12"
dashmap = "5"
cranelift-codegen = "0.132"
cranelift-frontend = "0.132"
cranelift-module = "0.132"
cranelift-jit = "0.132"
cranelift-object = "0.132"
cranelift-native = "0.132"
target-lexicon = "0.13"
wasm-encoder = "0.250"
wasmparser = "0.250"
bumpalo = "3"
libloading = "0.9"
tower-lsp = "0.20"
lsp-types = "0.97"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
git2 = { version = "0.19", default-features = false }
pulldown-cmark = "0.12"
askama = "0.12"
inkwell = { version = "0.5", features = ["llvm17-0"] }
wit-component = "0.225"
wit-parser = "0.225"
gimli = "0.31"
object = { version = "0.36", features = ["read", "write"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-pemfile = "2"
tokio-rustls = "0.26"
# v0.18 cluster wire (Tier 4.1): framed CBOR over TLS. `ciborium` is the
# maintained successor to `serde_cbor` and is already pulled in transitively;
# promoting it to a workspace dep gives the cluster module a direct handle.
ciborium = "0.2"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
opentelemetry = "0.27"
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic", "http-proto"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
tokio-util = "0.7"
criterion = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support"] }
crossbeam-deque = "0.8"
crossbeam-utils = "0.8"
# v0.10 cleanup — real sigstore keyless signing. Opt-in via the
# `mty-pkg/sigstore-real` cargo feature; default builds keep the
# v0.9 stub envelope. See `docs/internals/package-signing.md` for
# the cut-over plan + dep-graph rationale.
sigstore = { version = "0.14", default-features = false }

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# ----------------------------------------------------------------
# v0.22 PGO + ThinLTO build profile.
#
# `release-pgo` is the profile used by the two-stage profile-guided
# optimisation pipeline driven by `scripts/build-pgo.{sh,ps1}`. The
# pipeline:
#
#   1. Builds with `RUSTFLAGS="-Cprofile-generate=$PROFDIR"`
#      (instrumented binary writes .profraw on each run).
#   2. Runs `mty-bench-pgo` to exercise representative compile +
#      check workloads against the bundled examples.
#   3. Merges the .profraw shards into a single .profdata using
#      `llvm-profdata merge`.
#   4. Rebuilds with `RUSTFLAGS="-Cprofile-use=… -Clinker-plugin-lto"`
#      which is what eventually ships as the optimised `mty` binary.
#
# The profile inherits from `release` and turns up the dials that are
# only worth paying for in a release+PGO build (fat LTO, single
# codegen unit, debuginfo stripped). It is **not** wired into
# `release.yml` yet — v0.22 ships the manual `pgo-bench.yml` workflow
# for measurement only. See `docs/internals/pgo.md` and
# `dev/history/notes/PGO_V0_22_NOTES.md`.
# ----------------------------------------------------------------
[profile.release-pgo]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = false
strip = true

# ----------------------------------------------------------------
# Workspace-wide clippy lint policy. v0.11 makes the `clippy
# (strict)` CI job required by allow-listing the pedantic lints
# that are style preferences (not bugs) and keeping the rest at
# `warn` (which `-D warnings` then promotes to a hard error on CI).
#
# See `dev/history/notes/CLIPPY_V0_11_NOTES.md` for the per-lint
# rationale. Tighten by removing entries here as we converge.
# ----------------------------------------------------------------
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Style preferences we don't enforce — high-noise, low-signal.
module_name_repetitions = "allow"
missing_errors_doc = "allow"         # we use thiserror; errors self-describe
missing_panics_doc = "allow"
similar_names = "allow"
many_single_char_names = "allow"
too_many_lines = "allow"
unreadable_literal = "allow"
single_match_else = "allow"
if_not_else = "allow"
doc_markdown = "allow"               # technical prose has CamelCase / paths
match_same_arms = "allow"            # sometimes intentional for clarity
must_use_candidate = "allow"
return_self_not_must_use = "allow"
needless_pass_by_value = "allow"
uninlined_format_args = "allow"      # both forms read fine
redundant_closure_for_method_calls = "allow"
map_unwrap_or = "allow"
unused_self = "allow"
struct_field_names = "allow"
fn_params_excessive_bools = "allow"

# Numeric casts — we audit these at the use site; this is a
# compiler with lots of legitimate `usize as u32` conversions.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
cast_precision_loss = "allow"

# Iteration / pattern style — we keep the explicit form where it
# matches the surrounding code's voice.
enum_glob_use = "allow"
wildcard_imports = "allow"
items_after_statements = "allow"
elidable_lifetime_names = "allow"
explicit_iter_loop = "allow"
ignored_unit_patterns = "allow"
default_trait_access = "allow"
implicit_hasher = "allow"
ignore_without_reason = "allow"

# String building — `format!(..)` + `push_str` reads more clearly
# in HTML / template renderers than the trait-import dance for
# `write!`. Allowed because mty-doc's renderers lean on it heavily.
format_push_string = "allow"
# `bool_to_int_with_if` — `if b { 1 } else { 0 }` is clearer
# than `usize::from(b)` for some readers.
bool_to_int_with_if = "allow"
# `comparison_chain` — `if a < b { … } else if a > b { … }` is
# clearer than `match a.cmp(&b)` for numeric heuristics.
comparison_chain = "allow"
# `unnecessary_wraps` — sometimes the caller relies on `Result`
# being threaded through even when no error path exists yet
# (placeholder for future error paths).
unnecessary_wraps = "allow"
# `match_wildcard_for_single_variants` — guards against future
# variants but the explicit-arm form is sometimes more verbose
# than the wildcard.
match_wildcard_for_single_variants = "allow"
# Single-char string `contains("!")` vs `contains('!')` — either
# form reads fine; allow.
single_char_pattern = "allow"
# `needless_raw_string_hashes` — `r#"..."#` is consistent with
# raw strings that may grow to need hashes; allow either form.
needless_raw_string_hashes = "allow"
# `float_cmp` — interpreter compares NaN canonically; intentional.
float_cmp = "allow"
# `manual_string_new` — `String::default()` is sometimes clearer
# than `String::new()` in macro-derived code.
manual_string_new = "allow"
# `no_effect_underscore_binding` — bindings prefixed `_` are
# sometimes deliberate placeholders for unused captures.
no_effect_underscore_binding = "allow"
# `used_underscore_binding` — same rationale as above; an `_ty`
# parameter that ends up being returned shouldn't force a rename.
used_underscore_binding = "allow"
# `duration_suboptimal_units` — `Duration::from_secs(60)` is just
# as readable as `from_mins(1)` and avoids `from_mins`'s newer
# stabilization story.
duration_suboptimal_units = "allow"
# `unused_async` — runtime entry points are kept `async` for API
# stability even when the current body is sync, because callers
# already `.await` them and may grow new await points later.
unused_async = "allow"
# `missing_fields_in_debug` — sometimes the formatter intentionally
# elides large/cyclic fields (we'd just use `.finish_non_exhaustive`
# everywhere otherwise).
missing_fields_in_debug = "allow"
# `semicolon_if_nothing_returned` — both `b.iter(|| { … })` and
# `b.iter(|| { …; })` read fine in criterion bench closures.
semicolon_if_nothing_returned = "allow"
# `implicit_clone` — `path.to_path_buf()` on a `PathBuf` is OK;
# clippy's preference for `.clone()` is style only.
implicit_clone = "allow"
# `stable_sort_primitive` — we sometimes want stable sort for
# determinism even on primitives.
stable_sort_primitive = "allow"
# `manual_assert` — `if c { panic!(...) }` reads better than
# `assert!(!c, …)` in some places.
manual_assert = "allow"
