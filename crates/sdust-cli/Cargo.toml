[package]
name = "sdust-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "sdust"
path = "src/main.rs"

[dependencies]
clap.workspace = true
ariadne.workspace = true
sdust-driver = { path = "../sdust-driver" }
sdust-syntax = { path = "../sdust-syntax" }
sdust-ast = { path = "../sdust-ast" }
sdust-hir = { path = "../sdust-hir" }
sdust-diagnostics = { path = "../sdust-diagnostics" }
sdust-fmt = { path = "../sdust-fmt" }
sdust-sir = { path = "../sdust-sir" }
sdust-types = { path = "../sdust-types" }
sdust-borrow = { path = "../sdust-borrow" }
sdust-codegen-cranelift = { path = "../sdust-codegen-cranelift" }
sdust-codegen-wasm = { path = "../sdust-codegen-wasm" }
sdust-lsp = { path = "../sdust-lsp" }
sdust-doc = { path = "../sdust-doc" }
sdust-pkg = { path = "../sdust-pkg" }
# v0.3 Task 1: install the stdlib host dispatcher at CLI startup so
# `sdust run` programs that call `std.*` get the real implementations
# (json/fs/time/http) instead of `Value::Unit`. We disable the `runner`
# feature here to avoid the sdust-stdlib → sdust-driver dep cycle that
# blocked v0.2 (see STDLIB_V0_2_NOTES.md).
sdust-stdlib = { path = "../sdust-stdlib", default-features = false }
sdust-runtime = { path = "../sdust-runtime" }
