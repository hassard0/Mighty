[package]
name = "mty-codegen-cranelift"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Mighty Cranelift codegen backend (JIT + AOT object) — slice 8."

[dependencies]
mty-ir = { path = "../mty-ir" }
mty-types = { path = "../mty-types" }
mty-hir = { path = "../mty-hir" }
mty-diagnostics = { path = "../mty-diagnostics" }
mty-debuginfo = { path = "../mty-debuginfo" }
cranelift-codegen = { workspace = true }
cranelift-frontend = { workspace = true }
cranelift-module = { workspace = true }
cranelift-jit = { workspace = true }
cranelift-object = { workspace = true }
cranelift-native = { workspace = true }
target-lexicon = { workspace = true }
thiserror = { workspace = true }
# Match the `object` version cranelift-object 0.132 uses internally
# (its ObjectProduct.object is from object-0.39), not the workspace
# pin of 0.36 — those are separate copies and won't unify types.
object = { version = "0.39", default-features = false, features = ["write", "std", "coff", "elf", "macho", "pe"] }

[dev-dependencies]
gimli = { workspace = true, features = ["read", "std"] }
tempfile = "3"
criterion.workspace = true
# v0.21 — conformance_native test wires the parser → HIR → typeck → SIR
# pipeline so it can drive native_abi/*/input.mty straight through to
# an object file. The runtime crate is NOT pulled in (the conformance
# tests don't exercise tokio); we only need the static-analysis path.
mty-syntax = { path = "../mty-syntax" }
mty-ast = { path = "../mty-ast" }
mty-borrow = { path = "../mty-borrow" }
rowan = { workspace = true }
# v0.42 T4 (L23 fix) — `to_str_v042_t4.rs` exercises the typed
# `mty_runtime_fmt_*` / `mty_runtime_str_concat` symbols by name.
# The runtime crate is the only place those Rust impls live; we
# link it as a dev-dep so the test JIT sees real formatted bytes
# (not a no-op stub).
mty-runtime = { path = "../mty-runtime" }

[[bench]]
name = "typeck_parallel"
harness = false

[lints]
workspace = true
