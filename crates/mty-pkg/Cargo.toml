[package]
name = "mty-pkg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Mighty package manager: resolver, lockfile, fetchers."

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
sha2.workspace = true
hex.workspace = true
reqwest = { workspace = true, optional = true }
git2 = { workspace = true, optional = true }
mty-driver = { path = "../mty-driver" }
tar = "0.4"
flate2 = "1"
dirs = "5"

[features]
# Default: include fetchers. Tests that hit the network mark themselves
# `#[ignore]` so `cargo test -p mty-pkg` is hermetic.
default = ["registry-fetch", "git-fetch"]
registry-fetch = ["dep:reqwest"]
git-fetch = ["dep:git2"]

[dev-dependencies]
tempfile = "3"
