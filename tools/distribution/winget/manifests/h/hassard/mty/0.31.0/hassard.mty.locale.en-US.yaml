ShortDescription: Mighty - agent-first systems programming language.
Description: |-
  Mighty is a statically-typed, agent-first systems language. Agents,
  protocols, capabilities, effects, arenas, and budgets are first-class.
  The mty toolchain targets native code (Cranelift JIT + AOT) and
  WebAssembly (Component Model) from a single Rust workspace.

  Mighty makes prompt injection a compile error: tainted LLM/MCP/HTTP
  data cannot reach fs.write, process.exec, sql.execute, or net.request
  without a sanitiser. Every agent run is byte-identically replayable
  from the recorded transcript.
