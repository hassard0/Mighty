# Mighty JetBrains plugin metadata.
#
# These values feed both build.gradle.kts (plugin coordinates) and plugin.xml
# (the <version> tag is rewritten by the IntelliJ Platform Gradle Plugin from
# pluginVersion below at build time, so plugin.xml itself contains a
# placeholder).

pluginGroup = dev.mighty.jetbrains
pluginName = Mighty
pluginVersion = 0.32.0

# Min IntelliJ Platform build (241 == 2024.1) — matches platformVersion below.
# Why not 232 (2023.2, when LSP API first stabilised)? The LSP API
# (`com.intellij.platform.lsp.api`) only ships in the **paid** JetBrains IDEs
# (IDEA Ultimate, RustRover, PyCharm Pro, WebStorm, GoLand, PhpStorm,
# RubyMine, CLion, RustRover, DataGrip, Rider). Community editions don't
# include it. We compile against IntelliJ IDEA Ultimate 2024.1 so the LSP
# symbols resolve; runtime support spans every IDE listed in plugin.xml.
pluginSinceBuild = 241
# Empty = no upper bound (forwards-compatible).
pluginUntilBuild =

# Target IDE we build against. IU = IntelliJ IDEA Ultimate, which is the
# minimum that ships the `com.intellij.platform.lsp.api` module our LSP
# integration needs.
platformType = IU
platformVersion = 2024.1

# Kotlin / Gradle settings.
kotlin.stdlib.default.dependency = false
org.gradle.parallel = true
org.gradle.caching = true
org.gradle.jvmargs = -Xmx2g -XX:+UseG1GC -Dfile.encoding=UTF-8
systemProp.file.encoding = UTF-8
