[package]
name = "mty-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# v0.46 T1 — build.rs generates the runtime ABI header
# (`include/mty_runtime_abi.h`) + the symbol-table side file consumed
# by `crate::abi_export`. See build.rs for the parsing strategy.
build = "build.rs"

[lib]
# v0.46 T1 — `staticlib` adds `libmty_runtime.a` /
# `mty_runtime.lib` to the build output so downstream `extern c`
# consumers can link the runtime symbols directly instead of mirroring
# them by hand. The `rlib` keeps the Rust-internal callers (mty-cli,
# mty-driver, …) on the same code path; `lib` is the in-source path
# of the runtime crate.
crate-type = ["staticlib", "rlib"]

[dependencies]
mty-ir = { path = "../mty-ir" }
mty-types = { path = "../mty-types" }
mty-hir = { path = "../mty-hir" }
mty-diagnostics = { path = "../mty-diagnostics" }
tokio.workspace = true
tokio-util = { workspace = true, features = ["time", "rt"] }
parking_lot.workspace = true
dashmap.workspace = true
# v0.49 — native std.crypto / std.encoding codegen ABI. Same crates
# mty-stdlib uses for the interpreter path; depending on them directly
# (not on mty-stdlib) keeps the runtime free of a dependency cycle.
sha2.workspace = true
hex.workspace = true
hmac = "0.12"
base64 = "0.22"
blake3 = { version = "1", default-features = false, features = ["std"] }
thiserror.workspace = true
bumpalo.workspace = true
libloading.workspace = true
crossbeam-deque.workspace = true
crossbeam-utils.workspace = true
# v0.16 introspect: snapshot type + control-socket JSON I/O.
serde.workspace = true
serde_json.workspace = true
# v0.18 cluster (Tier 4.1): framed CBOR over TLS for cross-node send/ask.
ciborium.workspace = true
# v0.21 hot reload: parse incoming wasm bytes to extract mty custom sections
# (agent type + schema hash) before swapping the per-agent module slot.
wasmparser.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
tokio-rustls.workspace = true
opentelemetry = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }

[features]
default = ["otlp"]
otlp = ["dep:opentelemetry", "dep:opentelemetry-otlp", "dep:opentelemetry_sdk"]

[dev-dependencies]
mty-driver = { path = "../mty-driver" }
mty-stdlib = { path = "../mty-stdlib", default-features = false }
tokio = { workspace = true, features = ["test-util"] }
# v0.19 cluster routing tests: parse a synthetic `mighty.toml` with a
# `[cluster]` block via the manifest re-export in `mty-driver`.
toml.workspace = true
criterion.workspace = true
# v0.18 cluster tests: synthesize a self-signed TLS cert per-test so the
# multi-node mesh can handshake without any on-disk fixtures.
rcgen = "0.13"
# v0.21 hot reload tests: synthesize minimal wasm modules with mty custom
# sections so the wasm_loader path can be exercised without a full codegen
# round-trip.
wasm-encoder.workspace = true

[[bench]]
name = "mailbox_throughput"
harness = false

[[bench]]
name = "agent_send_latency"
harness = false

[lints]
workspace = true
