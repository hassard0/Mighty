[package]
name = "mty-borrow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
mty-hir = { path = "../mty-hir" }
mty-types = { path = "../mty-types" }
mty-diagnostics = { path = "../mty-diagnostics" }

[dev-dependencies]
mty-syntax = { path = "../mty-syntax" }
mty-ast = { path = "../mty-ast" }
mty-driver = { path = "../mty-driver" }

[features]
# v0.21: opt-in Polonius-style second-pass borrow checker. NLL is the
# default; enabling this feature runs an additional datalog-flavoured
# pass that catches some borrow patterns the lexical NLL accepts but
# Polonius rejects. See `crates/mty-borrow/src/polonius.rs` for the
# fact/rule model and `docs/internals/borrowck.md` §"Polonius".
polonius = []

[lints]
workspace = true
