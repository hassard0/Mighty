site_name: Mighty
site_url: https://hassard0.github.io/Mighty/
site_description: Mighty — a deterministic, agent-first systems language.
site_author: Ian Hassard
repo_url: https://github.com/hassard0/Mighty
repo_name: hassard0/Mighty
edit_uri: edit/main/docs/

docs_dir: docs

# v0.9 RC-prep: render the existing markdown corpus as a single
# navigable site. The mkdocs-material theme is pure-Python (no Ruby
# runtime needed on the CI runner) and ships with first-class search.
# Files listed here are mirrored from the on-disk layout under docs/;
# unlisted markdown still ships under the auto-generated nav.
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search

# Top-level nav — keep the structure stable across versions so deep
# links in release notes / blog posts don't rot. Sections marked
# (auto) pick up new files automatically via mkdocs' directory walk
# when they're not explicitly listed.
