# cargo-audit ignore list. Each entry MUST have a rationale comment.
# Format: see https://docs.rs/cargo-audit/latest/cargo_audit/config/
#
# Bump cargo-audit version in `.github/workflows/security.yml` if the
# format here changes.

[advisories]
ignore = [
    # wasmtime advisory bundle — wasmtime is a DEV-DEPENDENCY only,
    # used inside the `wasmtime_p2_smoke` test feature for end-to-end
    # WASI P2 host instantiation. mty itself does NOT ship wasmtime
    # at runtime: the production wasm backend is pure Cranelift +
    # `wit-component`. The advisories below are bundle-scanned out of
    # the dev-dep graph and do not affect any user of the `mty`
    # binary or crates.
    "RUSTSEC-2025-0118",  # wasmtime: vmctx aliasing in JIT
    "RUSTSEC-2026-0020",  # wasmtime: WebAssembly ref.* type confusion
    "RUSTSEC-2026-0021",  # wasmtime: gc heap underflow
    "RUSTSEC-2026-0085",  # wasmtime: 0085-series component-model bundle
    "RUSTSEC-2026-0086",
    "RUSTSEC-2026-0087",
    "RUSTSEC-2026-0088",
    "RUSTSEC-2026-0089",
    "RUSTSEC-2026-0090",
    "RUSTSEC-2026-0091",
    "RUSTSEC-2026-0092",
    "RUSTSEC-2026-0093",
    "RUSTSEC-2026-0094",
    "RUSTSEC-2026-0095",
    "RUSTSEC-2026-0096",  # wasmtime: aarch64 Cranelift miscompile (dev-dep only)
    "RUSTSEC-2025-0046",  # wasmtime: WASIp1 fd_renumber host panic (dev-dep only)

    # Unmaintained-crate warnings — transitive deps we do not call
    # directly. Tracked for replacement but not release-blocking.
    "RUSTSEC-2024-0436",  # paste: unmaintained (transitively via several macro crates)
    "RUSTSEC-2025-0134",  # rustls-pemfile: unmaintained (transitive via TLS stack)

    # Unsoundness in git2 0.19.0 used by mty-pkg for registry fetches.
    # The unsound API (Buf deref) is not invoked by mty-pkg; tracked
    # for git2 bump in v0.17.
    "RUSTSEC-2026-0008",
]
