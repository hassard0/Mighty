[package]
name = "sdust-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

description = "Stardust v0.6 benchmarks (criterion) and reference comparators."

[lib]
path = "src/lib.rs"

[[bin]]
name = "sdust-bench-runner"
path = "src/bin/sdust-bench-runner.rs"

[dependencies]
sdust-syntax    = { path = "../sdust-syntax" }
sdust-driver    = { path = "../sdust-driver" }
sdust-runtime   = { path = "../sdust-runtime", default-features = false }
sdust-sir       = { path = "../sdust-sir" }
sdust-types     = { path = "../sdust-types" }
sdust-codegen-wasm = { path = "../sdust-codegen-wasm" }
sdust-codegen-cranelift = { path = "../sdust-codegen-cranelift" }
sdust-diagnostics = { path = "../sdust-diagnostics" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
tempfile = "3"

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "parse_throughput"
harness = false

[[bench]]
name = "agent_send_latency"
harness = false

[[bench]]
name = "mailbox_throughput"
harness = false

[[bench]]
name = "http_server_throughput"
harness = false

[[bench]]
name = "compile_to_native"
harness = false

[[bench]]
name = "wasm_size"
harness = false
