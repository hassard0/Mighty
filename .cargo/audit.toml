# cargo-audit ignore list. Each entry MUST have a rationale comment.
# Format: see https://docs.rs/cargo-audit/latest/cargo_audit/config/
#
# Bump cargo-audit version in `.github/workflows/security.yml` if the
# format here changes.

[advisories]
ignore = [
    # Unmaintained-crate warnings — transitive deps we do not call
    # directly. Tracked for replacement but not release-blocking.
    "RUSTSEC-2024-0436",  # paste: unmaintained (transitively via several macro crates)
    "RUSTSEC-2025-0134",  # rustls-pemfile: unmaintained (transitive via TLS stack)

    # Unsoundness in git2 0.19.0 used by mty-pkg for registry fetches.
    # The unsound API (Buf deref) is not invoked by mty-pkg; tracked
    # for git2 bump in v0.17.
    "RUSTSEC-2026-0008",
]
